<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 240" width="1200" height="240" role="img" aria-label="Stream Deck Discord Volume Mixer">
  <defs>
    <linearGradient id="bgCard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e1f22"/>
      <stop offset=".55" stop-color="#141517"/>
      <stop offset="1" stop-color="#0e0f10"/>
    </linearGradient>
    <radialGradient id="blurpleGlow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#5865F2" stop-opacity=".45"/>
      <stop offset="1" stop-color="#5865F2" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="greenGlow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#23A55A" stop-opacity=".40"/>
      <stop offset="1" stop-color="#23A55A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bannerTitle" gradientUnits="userSpaceOnUse" x1="60" y1="0" x2="800" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".4" stop-color="#E0E3FF"/>
      <stop offset="1" stop-color="#5865F2"/>
    </linearGradient>
    <linearGradient id="hairline" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".25"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".03"/>
    </linearGradient>
    <linearGradient id="bannerRule" gradientUnits="userSpaceOnUse" x1="64" y1="0" x2="120" y2="0">
      <stop offset="0" stop-color="#23A55A" stop-opacity=".95"/>
      <stop offset=".5" stop-color="#5865F2" stop-opacity=".8"/>
      <stop offset="1" stop-color="#5865F2" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sweepGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#ffffff" stop-opacity=".05"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <pattern id="dotGrid" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="16" cy="16" r="1" fill="#5865F2" fill-opacity=".12"/>
    </pattern>
    <clipPath id="bannerClip"><rect x="0" y="0" width="1200" height="240" rx="24"/></clipPath>
  </defs>
  <style>
    @keyframes driftA { 0%,100% { transform: translate(0,0) } 50% { transform: translate(24px,-14px) } }
    @keyframes driftB { 0%,100% { transform: translate(0,0) } 50% { transform: translate(-20px,16px) } }
    @keyframes sweepAnimation { 0% { transform: translateX(-560px) } 100% { transform: translateX(1360px) } }
    @keyframes pulseGlow { 0%,100% { opacity:.6 } 50% { opacity:1 } }
    .d1 { animation: driftA 14s ease-in-out infinite; }
    .d2 { animation: driftB 18s ease-in-out infinite; }
    .sw { animation: sweepAnimation 9s linear infinite; }
    .pulse { animation: pulseGlow 6s ease-in-out infinite; }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important } }
  </style>
  <g clip-path="url(#bannerClip)">
    <rect width="1200" height="240" fill="url(#bgCard)"/>
    <rect width="1200" height="240" fill="url(#dotGrid)"/>
    <g class="d1"><ellipse cx="160" cy="10" rx="380" ry="210" fill="url(#greenGlow)"/></g>
    <g class="d2"><ellipse cx="1080" cy="220" rx="440" ry="240" fill="url(#blurpleGlow)"/></g>
    
    <!-- Decorative Stream Deck / Mixer Icon Graphic on the right -->
    <g opacity=".8" transform="translate(1000, 48)">
      <rect width="144" height="144" rx="32" fill="#2b2d31" stroke="url(#hairline)" stroke-width="1.5"/>
      <!-- Speaking green indicator border -->
      <rect x="8" y="8" width="128" height="128" rx="24" fill="none" stroke="#23A55A" stroke-width="3" stroke-dasharray="6,4" class="pulse"/>
      <!-- Discord Bot / Volume icon center -->
      <path d="M52 46c-2.4 0-4.6 1.4-5.6 3.6L34 76h-8c-3.3 0-6 2.7-6 6v8c0 3.3 2.7 6 6 6h8l12.4 26.4c1 2.2 3.2 3.6 5.6 3.6 3.5 0 6.4-2.9 6.4-6.4V52.4c0-3.5-2.9-6.4-6.4-6.4z" fill="#5865F2"/>
      <path d="M72 62c6.2 5.5 10 13.5 10 22s-3.8 16.5-10 22" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
      <path d="M84 50c9.5 8.7 15.5 21 15.5 34s-6 25.3-15.5 34" fill="none" stroke="#23A55A" stroke-width="4" stroke-linecap="round"/>
    </g>
    
    <rect class="sw" x="-560" y="0" width="560" height="240" fill="url(#sweepGrad)"/>
  </g>
  <rect x=".75" y=".75" width="1198.5" height="238.5" rx="24" fill="none" stroke="url(#hairline)" stroke-width="1.5"/>
  <g font-family='"Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif'>
    <rect x="64" y="44" width="44" height="4" rx="2" fill="url(#bannerRule)"/>
    <text x="64" y="78" font-size="13" font-weight="700" letter-spacing="3.2" fill="#5865F2">STREAM DECK AUDIO PLUGIN</text>
    <text x="62" y="142" font-size="44" font-weight="800" letter-spacing="-1.2" fill="url(#bannerTitle)">Discord Volume Mixer</text>
    <text x="64" y="180" font-size="18.5" font-weight="500" fill="#949BA4">Per-user voice mixing, live speaking detection &amp; dial controls on your desk.</text>
    <g>
      <rect x="1030" y="196" width="106" height="30" rx="15" fill="#ffffff" fill-opacity=".06" stroke="url(#hairline)" stroke-width="1"/>
      <text x="1083.0" y="216" text-anchor="middle" font-size="13.5" font-weight="700" letter-spacing=".5" fill="#DBDEE1">v2.0.3.0</text>
    </g>
  </g>
</svg>
